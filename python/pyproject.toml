[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "odca"
description = "One-dimensional cellular automata as art: the odca player and the odca-select workbench"
requires-python = ">=3.9"
dynamic = ["version"]
# pygame-ce, the community fork, not upstream pygame: it publishes wheels
# for new Python versions, which upstream has not done since 3.13. The two
# both install a module named `pygame` and cannot share a virtual
# environment; `import pygame` is the same either way.
dependencies = ["numpy", "pygame-ce"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
odca = "odca.play:main"
odca-select = "odca.select:main"

[tool.setuptools]
packages = ["odca"]

[tool.setuptools.dynamic]
version = {attr = "odca.__version__"}
