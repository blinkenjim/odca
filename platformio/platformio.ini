; ODCA on an MCU: two boards now, sharing this file and the engine/detector
; libraries in lib/. The RP2350 board (Waveshare RP2350-LCD-1.47-A) has
; the real, running firmware (src/main.cpp); the ESP32-C6 board (Waveshare
; ESP32-C6-LCD-1.47) is a new port starting here — the manufacturer's own
; spec pages confirm the same 172x320 ST7789 panel and driver chip, so
; only pin numbers, the RNG call, and the BOOT-button read are expected to
; differ once the port gets that far.
[platformio]
default_envs = rpipico2

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4

; RP2350: PlatformIO's own `raspberrypi` platform does not yet carry
; RP2350 support, so this pins the community fork that does, as
; arduino-pico's own PlatformIO docs currently direct:
; https://arduino-pico.readthedocs.io/en/latest/platformio.html
;
; The engine (R-M) and boring detector (R-A) running headlessly, proven
; against conformance/vectors.json — see ../REQTS.md and README.md.
; src_dir is a project-wide setting, not per-environment (a first attempt
; at this got that wrong — see the commit history), so all environments
; share src/, and build_src_filter picks one main() per environment.
; Each filter names its own main and excludes everything else
; (`-<*> +<the_one.cpp>`) rather than listing the others to exclude:
; with three boards and seven environments, the exclusion form meant
; every new file had to be added to every other environment's line, and
; forgetting one only surfaced as a confusing unrelated build error.
[env:rpipico2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
board_build.core = earlephilhower
; Arduino-Pico's "release mode" defaults to -Os (optimize for size); flash
; and RAM headroom here is enormous, so there's no reason to trade speed
; for size on this CPU-bound workload.
build_unflags = -Os
build_flags = -O2
build_src_filter = -<*> +<main.cpp>

; A separate sandbox for the display, kept apart from the real firmware's
; main() until it's ready to join it. `pio run -e display -t upload`
; builds and flashes this one instead.
[env:display]
extends = env:rpipico2
build_src_filter = -<*> +<main_display_test.cpp>

; ESP32-C6 (Waveshare ESP32-C6-LCD-1.47). PlatformIO's own espressif32
; platform's board definitions still declare only "espidf" as a
; supported framework for every ESP32-C6 board entry (a metadata gap,
; not a real limitation — arduino-esp32 itself supports this chip),
; so a plain `framework = arduino` here fails with "This board doesn't
; support arduino framework!" The same kind of gap the RP2350 side hit
; with the official raspberrypi platform; the fix is the same shape,
; a community fork that stays current — pioarduino's, the one its own
; docs point to for exactly this.
;
; This chip has no separate USB-UART bridge, only its own native USB;
; without ARDUINO_USB_CDC_ON_BOOT, arduino-esp32 defaults Serial to
; UART0's GPIO pins instead of the USB port actually connected, so
; Serial.begin()/print() silently go nowhere a host can see them. The
; C6 (like the C3/H2) has only the simpler USB-Serial-JTAG peripheral,
; not the full USB-OTG PHY the S2/S3 have, so ARDUINO_USB_MODE=1 is
; also needed to pick HardwareSerial.h's HWCDC path (Serial = HWCDCSerial)
; instead of its USB-OTG path (Serial = USBSerial, undeclared on this
; chip — the build fails outright without this).
[env:esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = -<*> +<main_esp32c6.cpp>

; The toolchain smoke test this side started with (a serial heartbeat,
; nothing more), kept apart now that src/main_esp32c6.cpp is the real
; firmware — the same relationship main.cpp and main_display_test.cpp
; have on the RP2350 side. `pio run -e esp32c6-hello -t upload`.
[env:esp32c6-hello]
extends = env:esp32c6
build_src_filter = -<*> +<main_esp32c6_hello.cpp>

; A third board: the "CYD" (Cheap Yellow Display, ESP32-2432S028), a
; classic ESP32-WROOM-32 module with a 2.8" 320x240 TFT — a different
; driver chip than the other two boards' shared 172x320 ST7789 panel
; (ILI9341 on most units, ST7789 on some later batches, per community
; documentation; unconfirmed which this unit is until checked). Classic
; ESP32 is mature, longstanding PlatformIO territory: the official
; espressif32 platform's `esp32dev` board already declares `arduino`
; support directly, unlike the ESP32-C6 (no fork needed here), and this
; module's plain CH340 USB-UART bridge needs none of the C6's native-
; USB build flags either — Serial just works, though reading it back on
; this machine needs an explicit baud rate (raw `cat` picked up
; garbage; a small pyserial script with baud=115200 read it cleanly —
; this chip's real UART bridge cares about baud in a way the other two
; boards' native-USB serial didn't).
;
; Its own SPI clock started at a deliberately conservative 10MHz in
; main_cyd_display_test.cpp, not a guess at something higher: the
; ESP32-C6 board taught this arc a real lesson (session notes, 2026-09):
; too-fast SPI on GPIO-matrix-routed pins didn't just glitch, it
; permanently desynced the display's command/data framing with no
; self-recovery, surviving less and less time as the clock rose. This
; board's SPI pins are also GPIO-matrix-routed, not dedicated hardware
; SPI pins, so the same risk applies until proven otherwise.
[env:cyd]
platform = espressif32
board = esp32dev
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit ILI9341@^1.6.1
build_src_filter = -<*> +<main_cyd.cpp>

; The toolchain smoke test this side started with. `pio run -e
; cyd-hello -t upload`.
[env:cyd-hello]
extends = env:cyd
build_src_filter = -<*> +<main_cyd_hello.cpp>

; Proving the display link before the real firmware touches it — the
; same role env:display plays for the RP2350 board. `pio run -e
; cyd-display -t upload`.
[env:cyd-display]
extends = env:cyd
build_src_filter = -<*> +<main_cyd_display_test.cpp>
