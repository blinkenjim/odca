; ODCA on an MCU: two boards, sharing this file and the engine/detector
; libraries in lib/. The RP2350 board (Waveshare RP2350-LCD-1.47-A) runs
; src/main.cpp; the CYD (ESP32-2432S028) runs src/main_cyd.cpp.
;
; A Waveshare ESP32-C6-LCD-1.47 was supported here for a day and was
; dropped (2026-09-19): its display kept corrupting and freezing for
; good, at every SPI clock tried and whether it repainted the whole
; window or wrote single rows by hardware scroll. ESP32-C6-DROPPED.md
; has the full account, including what was never tried. Two findings
; from it are load-bearing in src/main_cyd.cpp: that exposure to bus
; corruption scales with bytes moved rather than with clock rate, and
; that which SPI peripheral a board's display pins belong to is worth
; checking before assuming the pins are slow.
[platformio]
default_envs = rpipico2

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4

; RP2350: PlatformIO's own `raspberrypi` platform does not yet carry
; RP2350 support, so this pins the community fork that does, as
; arduino-pico's own PlatformIO docs currently direct:
; https://arduino-pico.readthedocs.io/en/latest/platformio.html
;
; The engine (R-M) and boring detector (R-A) running headlessly, proven
; against conformance/vectors.json — see ../REQTS.md and README.md.
; src_dir is a project-wide setting, not per-environment (a first attempt
; at this got that wrong — see the commit history), so all environments
; share src/, and build_src_filter picks one main() per environment.
; Each filter names its own main and excludes everything else
; (`-<*> +<the_one.cpp>`) rather than listing the others to exclude: the
; exclusion form meant every new file had to be added to every other
; environment's line, and forgetting one only surfaced as a confusing
; unrelated build error.
[env:rpipico2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
board_build.core = earlephilhower
; Arduino-Pico's "release mode" defaults to -Os (optimize for size); flash
; and RAM headroom here is enormous, so there's no reason to trade speed
; for size on this CPU-bound workload.
build_unflags = -Os
build_flags = -O2
build_src_filter = -<*> +<main.cpp>

; A separate sandbox for the display, kept apart from the real firmware's
; main() until it's ready to join it. `pio run -e display -t upload`
; builds and flashes this one instead.
[env:display]
extends = env:rpipico2
build_src_filter = -<*> +<main_display_test.cpp>

; The "CYD" (Cheap Yellow Display, ESP32-2432S028), a classic
; ESP32-WROOM-32 module with a 2.8" ILI9341 panel — a different driver
; chip from the RP2350 board's ST7789, and one whose identity had to be
; checked rather than assumed (most CYD units are ILI9341, some later
; batches ST7789, per community documentation).
;
; Classic ESP32 is mature, longstanding PlatformIO territory: the
; official espressif32 platform's `esp32dev` board already declares
; `arduino` support, so no community platform fork is needed. Its plain
; CH340 USB-UART bridge needs no special build flags either, though
; reading its serial back on this machine does need the baud rate set
; explicitly — a raw `cat` on the device gets garbage, where the RP2350
; board's native USB does not care.
;
; Its display runs on HSPI at 80MHz; see src/main_cyd.cpp's own comments
; for why HSPI specifically, and why that choice is what makes 80MHz
; available at all.
[env:cyd]
platform = espressif32
board = esp32dev
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit ILI9341@^1.6.1
build_src_filter = -<*> +<main_cyd.cpp>

; The toolchain smoke test this side started with. `pio run -e
; cyd-hello -t upload`.
[env:cyd-hello]
extends = env:cyd
build_src_filter = -<*> +<main_cyd_hello.cpp>

; Proving the display link before the real firmware touches it — the
; same role env:display plays for the RP2350 board. `pio run -e
; cyd-display -t upload`.
[env:cyd-display]
extends = env:cyd
build_src_filter = -<*> +<main_cyd_display_test.cpp>
