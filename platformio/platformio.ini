; ODCA on an MCU (early scaffold, not yet a port of the engine).
;
; Target: the RP2350-based board (Waveshare RP2350-LCD-1.47-A, chip
; package RP2350A), via the earlephilhower Arduino-Pico core. PlatformIO's
; own `raspberrypi` platform does not yet carry RP2350 support, so this
; pins the community fork that does, as arduino-pico's own PlatformIO
; docs currently direct: https://arduino-pico.readthedocs.io/en/latest/platformio.html
[env:rpipico2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
