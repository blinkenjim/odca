; ODCA on an MCU (early scaffold, not yet a full port of the display side).
;
; Target: the RP2350-based board (Waveshare RP2350-LCD-1.47-A, chip
; package RP2350A), via the earlephilhower Arduino-Pico core. PlatformIO's
; own `raspberrypi` platform does not yet carry RP2350 support, so this
; pins the community fork that does, as arduino-pico's own PlatformIO
; docs currently direct: https://arduino-pico.readthedocs.io/en/latest/platformio.html
[platformio]
default_envs = rpipico2

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
; Arduino-Pico's "release mode" defaults to -Os (optimize for size); flash
; and RAM headroom here is enormous, so there's no reason to trade speed
; for size on this CPU-bound workload.
build_unflags = -Os
build_flags = -O2
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4

; The engine (R-M) and boring detector (R-A) running headlessly, proven
; against conformance/vectors.json — see ../REQTS.md and README.md.
; src_dir is a project-wide setting, not per-environment (a first attempt
; at this got that wrong — see the commit history), so both environments
; share src/, and build_src_filter below picks one main() per environment.
[env:rpipico2]
build_src_filter = +<*> -<main_display_test.cpp>

; A separate sandbox for the display, kept apart from the real firmware's
; main() until it's ready to join it. `pio run -e display -t upload`
; builds and flashes this one instead.
[env:display]
build_src_filter = +<*> -<main.cpp>
